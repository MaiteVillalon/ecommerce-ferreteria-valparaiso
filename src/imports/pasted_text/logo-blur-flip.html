<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logos with Blur Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Inter', sans-serif;
    background:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 60px 20px;
  }

  .section{
    max-width: 900px;
    width:100%;
    text-align:center;
  }

  h2{
    font-size: clamp(30px, 5vw, 46px);
    font-weight:800;
    color:#262626;
    letter-spacing:-0.01em;
    margin-bottom: 14px;
  }

  .subtitle{
    color:#737373;
    font-size: 16px;
    margin-bottom: 64px;
  }

  .logo-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
    align-items:center;
  }

  .logo-flip{
    perspective: 700px;
    height: 40px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logo-flip-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    animation: flip 6s ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
  }
  .face-blur{ transform: rotateY(180deg); filter: blur(5px); opacity:0.55; }

  .face span{
    font-weight:700;
    font-size:19px;
    color:#171717;
    white-space:nowrap;
  }
  .icon{ width:26px; height:26px; flex-shrink:0; border-radius:7px; }

  @keyframes flip{
    0%, 42%{ transform: rotateY(0deg); }
    50%, 88%{ transform: rotateY(180deg); }
    96%, 100%{ transform: rotateY(360deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .logo-flip-inner{ animation: none; transform: rotateY(0deg); }
  }

  @media (max-width: 720px){
    .logo-grid{ grid-template-columns: repeat(2, 1fr); row-gap: 40px; }
  }
</style>
</head>
<body>

<div class="section">
  <h2>Trusted by the best companies</h2>
  <p class="subtitle">Companies that have been using our product from the very start.</p>

  <div class="logo-grid">

    <div class="logo-flip" style="--delay: -0.4s;">
      <div class="logo-flip-inner">
        <div class="face face-sharp">
          <svg class="icon" viewBox="0 0 26 26"><rect width="26" height="26" rx="7" fill="#111"/><path d="M13 5L6 20h4l1.6-3.4h6.8L20 20h4L17 5h-4zm-.4 8.2L13 9l2.4 5.2h-3.8z" fill="#fff"/></svg>
          <span>Aceternity UI</span>
        </div>
        <div class="face face-blur">
          <svg class="icon" viewBox="0 0 26 26"><rect width="26" height="26" rx="7" fill="#111"/><path d="M13 5L6 20h4l1.6-3.4h6.8L20 20h4L17 5h-4zm-.4 8.2L13 9l2.4 5.2h-3.8z" fill="#fff"/></svg>
          <span>Aceternity UI</span>
        </div>
      </div>
    </div>

    <div class="logo-flip" style="--delay: -2.0s;">
      <div class="logo-flip-inner">
        <div class="face face-sharp">
          <svg class="icon" viewBox="0 0 26 26"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#60A5FA"/></linearGradient></defs><circle cx="13" cy="11" r="8" fill="url(#g1)"/><path d="M13 18c0 3-2 5-2 5s2 0 2-2 2 2 2 2-2-2-2-5z" fill="url(#g1)"/></svg>
          <span>Gamity</span>
        </div>
        <div class="face face-blur">
          <svg class="icon" viewBox="0 0 26 26"><circle cx="13" cy="11" r="8" fill="url(#g1)"/><path d="M13 18c0 3-2 5-2 5s2 0 2-2 2 2 2 2-2-2-2-5z" fill="url(#g1)"/></svg>
          <span>Gamity</span>
        </div>
      </div>
    </div>

    <div class="logo-flip" style="--delay: -3.6s;">
      <div class="logo-flip-inner">
        <div class="face face-sharp">
          <svg class="icon" viewBox="0 0 26 26"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDBA74"/><stop offset="1" stop-color="#EA580C"/></linearGradient></defs><circle cx="13" cy="13" r="9" fill="url(#g2)"/><circle cx="10" cy="10" r="3" fill="#FFF7ED" opacity="0.7"/></svg>
          <span>Host IT</span>
        </div>
        <div class="face face-blur">
          <svg class="icon" viewBox="0 0 26 26"><circle cx="13" cy="13" r="9" fill="url(#g2)"/><circle cx="10" cy="10" r="3" fill="#FFF7ED" opacity="0.7"/></svg>
          <span>Host IT</span>
        </div>
      </div>
    </div>

    <div class="logo-flip" style="--delay: -5.2s;">
      <div class="logo-flip-inner">
        <div class="face face-sharp">
          <svg class="icon" viewBox="0 0 26 26"><path d="M13 3L23 22H3L13 3z" fill="#FB7185"/></svg>
          <span>Asteroid Kit</span>
        </div>
        <div class="face face-blur">
          <svg class="icon" viewBox="0 0 26 26"><path d="M13 3L23 22H3L13 3z" fill="#FB7185"/></svg>
          <span>Asteroid Kit</span>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
